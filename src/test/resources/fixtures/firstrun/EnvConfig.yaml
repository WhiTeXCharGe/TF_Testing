# Fixture "firstrun" - EnvConfig. A first run: Schedule.yaml has an EMPTY assignment_list, three modules and a
# trip_list with one Fixed and one Flexible trip (EndToEndTest.empty_assignment_list_first_run).
#
# World: 2 regions (ra, rb), 2 fabs (fa in ra, fb in rb), 5 workers, one workflow with two phases.
# Plan range (Schedule.yaml): 2027/01/11 (Mon) .. 2027/01/24 (Sun).
# Weekends are closed in both regions. stay_off_interval is 2, a 1-day transit between ra and rb.
environment:
  workflow_list:
  - id: wf1
    name: First Run Tool
    phase_list:
    - id: p1
      name: Move In
      operation_list:
      - id: p1o1
        name: Mech
        work_hours: [8, 10]
        min_worker_num: 1
        max_worker_num: 2
    - id: p2
      name: Setup
      operation_list:
      - id: p2o1
        name: Elec
        work_hours: [8, 10]
        min_worker_num: 1
        max_worker_num: 2
  fab_list:
  - id: fa
    name: Fab A
    region: ra
    customer_company: ca
    unavailable_dates: []
  - id: fb
    name: Fab B
    region: rb
    customer_company: ca
    unavailable_dates: []
  region_list:
  - id: ra
    name: Region A
    max_stay_on: 30
    max_annual_stay: 200
    stay_off_interval: 2
    unavailable_dates:
    - weekly:
        weekdays: [sat, sun]
  - id: rb
    name: Region B
    max_stay_on: 30
    max_annual_stay: 200
    stay_off_interval: 2
    unavailable_dates:
    - weekly:
        weekdays: [sat, sun]
  customer_company_list:
  - id: ca
    name: Customer A
    unavailable_dates: []
  worker_company_list:
  - id: wca
    name: Worker Company A
    annual_overtime_limit: 10000
    monthly_overtime_limit: 10000
    unavailable_dates: []
  transite_day_map:
  - from: ra
    to: rb
    days: 1
  - from: rb
    to: ra
    days: 1
  affinity_tag: []
  worker_list:
  - id: m1
    name: Manager
    worker_company: wca
    is_manager: true
    skill_map: {p1o1: 3, p2o1: 3}
    worker_type_by_operation: {}
    fab_suitability_map: []
    unavailable_dates: []
    affinity: []
  - id: t1
    name: Tech One
    worker_company: wca
    is_manager: false
    skill_map: {p1o1: 2, p2o1: 2}
    worker_type_by_operation: {}
    fab_suitability_map: []
    unavailable_dates: []
    affinity: []
  - id: t2
    name: Tech Two
    worker_company: wca
    is_manager: false
    skill_map: {p1o1: 2, p2o1: 2}
    worker_type_by_operation: {}
    fab_suitability_map: []
    unavailable_dates: []
    affinity: []
  - id: t3
    name: Tech Three
    worker_company: wca
    is_manager: false
    skill_map: {p1o1: 2, p2o1: 2}
    worker_type_by_operation: {}
    fab_suitability_map: []
    unavailable_dates: []
    affinity: []
  - id: t4
    name: Tech Four
    worker_company: wca
    is_manager: false
    skill_map: {p2o1: 2}
    worker_type_by_operation: {}
    fab_suitability_map: []
    unavailable_dates: []
    affinity: []
