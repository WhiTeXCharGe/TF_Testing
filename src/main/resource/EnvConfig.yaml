environment:
  workflow_list:
  - id: workflow
    name: Equipment Setup
    phase_list:
    - id: p1
      name: Module Setup
      operation_list:
      - id: p1o1
        name: Heavy
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
      - id: p1o2
        name: Mech
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
      - id: p1o3
        name: Elec
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
    - id: p2
      name: Hardware Setup
      operation_list:
      - id: p2o1
        name: Mech
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
      - id: p2o2
        name: Elec
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
    - id: p3
      name: Function Setup
      operation_list:
      - id: p3o1
        name: QC
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
    - id: p4
      name: Acceptance Inspection
      operation_list:
      - id: p4o1
        name: QC
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
      - id: p4o2
        name: Mech
        work_hours: [8, 10, 12]
        min_worker_num: 2
        max_worker_num: 3
  fab_list:
  - id: f1
    name: AAA Fab1
    region: r1
    customer_company: c1
    unavailable_dates: []
  - id: f2
    name: BBB Fab2
    region: r1
    customer_company: c2
    unavailable_dates: []
  - id: f3
    name: AAA Fab3
    region: r2
    customer_company: c1
    unavailable_dates: []
  - id: f4
    name: BBB Fab4
    region: r2
    customer_company: c2
    unavailable_dates: []
  region_list:
  - id: r1
    name: America
    max_stay_on: 80
    max_annual_stay: 240
    stay_off_interval: 3
    unavailable_dates:
    - weekly:
        weekdays: [sat, sun]
  - id: r2
    name: Germany
    max_stay_on: 80
    max_annual_stay: 240
    stay_off_interval: 3
    unavailable_dates:
    - weekly:
        weekdays: [sat, sun]
  customer_company_list:
  - id: c1
    name: AAA
    unavailable_dates: []
  - id: c2
    name: BBB
    unavailable_dates: []
  worker_company_list:
  - id: wc1
    name: AAA
    annual_overtime_limit: 360
    monthly_overtime_limit: 40
    unavailable_dates: []
  - id: wc2
    name: BBB
    annual_overtime_limit: 360
    monthly_overtime_limit: 40
    unavailable_dates: []
  transite_day_map:
  - from: r1
    to: r2
    days: 1
  - from: r2
    to: r1
    days: 1
  affinity_tag:
  - id: wct1
    weight: 2
  - id: wct2
    weight: 2
  - id: a1
    weight: 1
  - id: a2
    weight: 1
  - id: a3
    weight: 1
  - id: a4
    weight: -1
  worker_list:
  - id: w1
    name: AA
    worker_company: wc1
    is_manager: true
    skill_map: {p1o1: 4, p1o3: 3, p3o1: 3, p4o1: 3}
    worker_type_by_operation:
      p1o1: regular
      p1o3: regular
      p3o1: regular
      p4o1: regular
    fab_suitability_map:
    - kind: region
      suitability: {r1: 1, r2: 2}
    - kind: customer_company
      suitability: {c1: 1, c2: 1}
    unavailable_dates:
    - single:
        days:
        - 2025/09/28
        - 2025/10/09
    affinity: [wct1]
