# Rebuild the collab image and roll ACA1 + ACA2. Manual for now (workflow_dispatch);
# flip on the `push` trigger once the Azure resources from infra/deploy.sh exist
# and the AZURE_CREDENTIALS repo secret is set.
name: deploy-collab

on:
  workflow_dispatch:
  # push:
  #   branches: [GanttChartEditor]
  #   paths: ['GanttChartEditor/server/**']

env:
  RG: rg-gantt-collab
  ACR: acrganttcollabREPLACE
  IMAGE: gantt-collab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image from ./GanttChartEditor/server
        run: |
          TAG=${GITHUB_SHA::7}
          az acr build -r "$ACR" -t "$IMAGE:$TAG" ./GanttChartEditor/server
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Roll ACA2 then ACA1
        run: |
          IMG="$ACR.azurecr.io/$IMAGE:$TAG"
          az containerapp update -n ca-gantt-aca2 -g "$RG" --image "$IMG"
          az containerapp update -n ca-gantt-aca1 -g "$RG" --image "$IMG"

      - name: Smoke test
        run: |
          ACA1=$(az containerapp show -n ca-gantt-aca1 -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS "https://$ACA1/api/health"
